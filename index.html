<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body class="bg-black">
    <div class="container-sm bg-light pb-3 pt-3 w-75 mx-auto">
        <div class="row">
            <div class="col">
                <div class="card mx-5">
                    <div class="card-header bg-danger bg-opacity-10">
                        <h6 class="card-title fs-4 fw-bold">Payment form Example</h6>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger" role="alert">
                            some fields are missing
                        </div>
                        <form class="row g-3 needs-validation" novalidate>
                            <div class="col-md-4">
                                <label for="cardNumber" class="form-label">Card #</label>
                                <input type="text" class="form-control" id="cardNumber" name="cardNumber"
                                    placeholder="XXXXXXXXXXXXXXXX" inputmode="numeric" pattern="[0-9\s]{13,19}"
                                    required>
                            </div>
                            <div class="col-md-4">
                                <label for="cvc" class="form-label">CVC #</label>
                                <input type="text" class="form-control" id="cvc" name="cvc" placeholder="0000"
                                    inputmode="numeric" pattern="[0-9]{3,4}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="amount" class="form-label">Amount</label>
                                <div class="d-flex align-items-center">
                                    <span class="me-2 fs-7">$</span>
                                    <input type="text" class="form-control" id="amount" placeholder="Amount" min="0.01"
                                        step="0.01" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" name="city" required>
                            </div>
                            <div class="col-md-3">
                                <label for="state" class="form-label">State</label>
                                <select class="form-select" id="state" name="state" required>
                                    <option selected disabled value="">Pick a state</option>
                                    <option>Buenos Aires</option>
                                    <option>Córdoba</option>
                                    <option>Mendoza</option>
                                    <option>Santa Fe</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="postalCode" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="postalCode" name="postalCode" required>
                            </div>
                            <div class="col-md-6">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" name="city" required>
                            </div>
                            <div class="col-md-3">
                                <label for="state" class="form-label">State</label>
                                <select class="form-select" id="state" name="state" required>
                                    <option selected disabled value="">Pick a state</option>
                                    <option>Buenos Aires</option>
                                    <option>Córdoba</option>
                                    <option>Mendoza</option>
                                    <option>Santa Fe</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="postalCode" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="postalCode" name="postalCode" required>
                            </div>
                            <div class="col-md-6 mt-3">
                                <div><label class="form-label">We accept:</label></div>
                                <div class="bg-secondary p-2 rounded d-inline-flex gap-2 align-items-center">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault"
                                            id="flexRadioDefault1">
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            <i class="fa-brands fa-cc-mastercard text-light"></i>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault"
                                            id="flexRadioDefault1">
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            <i class="fa-brands fa-cc-visa text-light"></i>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault"
                                            id="flexRadioDefault1">
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            <i class="fa-brands fa-cc-diners-club text-light"></i>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault"
                                            id="flexRadioDefault1">
                                        <label class="form-check-label" for="flexRadioDefault1">
                                            <i class="fab fa-cc-amex text-light"></i>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 mt-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="3"></textarea>Add any notes here
                            </div>
                    </div>
                    <div class="card-footer bg-light f-">
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button class="btn btn-secondary md-1" type="button">Cancel</button>
                            <button class="btn btn-primary" type="button">Send</button>
                        </div>
                    </div>
                </div>
                </form>
            </div>
        </div>
    </div>
    </div>
    </div>
    <div class="row"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/2a676e5b02.js" crossorigin="anonymous"></script>
</body>
</html>
